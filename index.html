<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Sets the character encoding so text renders properly -->
  <meta charset="UTF-8" />
  <!-- Ensures the page scales nicely on both mobile and desktop screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Sets the title shown in the browser tab -->
  <title>Drum Kit</title>
  <!-- Links this HTML file to the external CSS file for styling -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Clickable button representing the kick drum -->
  <button id="kick-btn" class="drum-btn">Kick</button>

  <!-- Audio element that pre-loads the kick sound from the "sounds" folder -->
  <audio id="kick-sound" src="sounds/kick.wav" preload="auto"></audio>

  <!-- Links this HTML file to the external JavaScript file for interactivity -->
  <script src="script.js"></script>
</body>
</html>
